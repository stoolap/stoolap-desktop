[package]
name = "stoolap-desktop"
version = "0.5.19"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
stoolap = { version = "0.5.1", default-features = false, features = ["parallel", "jemalloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
futures-util = "0.3"
# reqwest is built without a TLS crypto provider (as the updater uses it);
# this is the one the app installs: ring, already in the tree
rustls = { version = "0.23", default-features = false, features = ["ring"] }
keyring = "4"
tiny_http = "0.12"
# Unpacking and checking the on-demand download of Anthropic's ant CLI
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAnimation", "NSAnimationContext", "NSApplication", "NSAttributedString", "NSColor", "NSColorSpace", "NSFont", "NSImage", "NSParagraphStyle", "NSResponder", "NSSplitView", "NSSplitViewController", "NSSplitViewItem", "NSText", "NSToolbar", "NSUserInterfaceItemSearching", "NSView", "NSViewController", "NSWindow"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
