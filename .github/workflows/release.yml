name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Re-pushing a tag cancels the older run so we don't pile up queued jobs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest  # Cross-compile on Apple Silicon — macos-13 Intel runners queue forever
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # The tag's section of CHANGELOG.md; fails the release when it is missing
      - name: Release note
        id: notes
        shell: bash
        run: |
          notes="$(node .github/scripts/release-notes.mjs "${{ github.ref_name }}")"
          if [ -z "$notes" ]; then
            echo "::error::The release note for ${{ github.ref_name }} came out empty"
            exit 1
          fi
          {
            echo 'body<<RELEASE_NOTE_EOF'
            echo "$notes"
            echo 'RELEASE_NOTE_EOF'
            # The bundles are named with the version, without the tag's "v"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (required for auto-update to work)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Developer ID) + notarization. tauri-action
          # signs as soon as any of these is set, even to an empty string, so
          # all six secrets must exist; the Windows and Linux builds ignore them
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Stoolap Desktop ${{ github.ref_name }}'
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            ## Downloads

            Pick the installer for your operating system.

            | Platform | File | Notes |
            |----------|------|-------|
            | **macOS — Apple Silicon** (M1/M2/M3/M4) | `Stoolap.Desktop_${{ steps.notes.outputs.version }}_aarch64.dmg` | Recommended for all Apple Silicon Macs |
            | **macOS — Intel** | `Stoolap.Desktop_${{ steps.notes.outputs.version }}_x64.dmg` | For Intel-based Macs (pre-2020) |
            | **Windows 10 / 11** | `Stoolap.Desktop_${{ steps.notes.outputs.version }}_x64-setup.exe` | Recommended. Or `_x64_en-US.msi` for admin deployment |
            | **Linux — Debian / Ubuntu** | `Stoolap.Desktop_${{ steps.notes.outputs.version }}_amd64.deb` | `sudo dpkg -i <file>` |
            | **Linux — Fedora / RHEL** | `Stoolap.Desktop-${{ steps.notes.outputs.version }}-1.x86_64.rpm` | `sudo rpm -i <file>` |
            | **Linux — any distro** | `Stoolap.Desktop_${{ steps.notes.outputs.version }}_amd64.AppImage` | Portable; `chmod +x` then run |

            ### Not sure which Mac you have?
            Click the Apple menu → **About This Mac**. *Apple M1/M2/M3/M4* → use `aarch64`. *Intel* → use `x64`.

            ### Auto-update
            Installed apps check for new releases on launch. You can also trigger a check manually from **Stoolap Desktop → Check for Updates…** (macOS) or the Help menu (Linux / Windows).

            ---

            The `.sig` and `.app.tar.gz` files next to each installer are used by the auto-updater — you do not need to download them.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark release as published
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            // `getReleaseByTag` returns 404 for drafts, so list and filter.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const release = releases.find((r) => r.tag_name === tag);
            if (!release) {
              throw new Error(`No release found for tag ${tag}`);
            }

            // The update notice in the app shows latest.json's notes, which
            // tauri-action fills with the whole release body (downloads table
            // included). Give it the release note alone.
            const { readFileSync } = require('fs');
            const { releaseNotes } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-notes.mjs`);
            const notes = releaseNotes(readFileSync('CHANGELOG.md', 'utf8'), tag);
            if (!notes) throw new Error(`CHANGELOG.md has no "## ${tag}" section`);
            const asset = release.assets.find((a) => a.name === 'latest.json');
            if (!asset) throw new Error('The release has no latest.json');
            const { data } = await github.rest.repos.getReleaseAsset({
              owner, repo, asset_id: asset.id,
              headers: { accept: 'application/octet-stream' },
            });
            const updater = JSON.parse(Buffer.from(data).toString('utf8'));
            updater.notes = notes;
            await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name: 'latest.json',
              data: JSON.stringify(updater, null, 2),
              headers: { 'content-type': 'application/json' },
            });

            await github.rest.repos.updateRelease({
              owner, repo,
              release_id: release.id,
              draft: false,
              generate_release_notes: true,
            });
